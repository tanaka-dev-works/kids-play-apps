<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かさをひらいて</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #1a2a4a;
  width: 100vw; height: 100vh;
  overflow: hidden;
  font-family: 'Hiragino Maru Gothic Pro', 'BIZ UDPGothic', sans-serif;
  user-select: none;
  cursor: none;
}
canvas { display:block; }
#hint {
  position: absolute;
  top: 24px; left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.45);
  font-size: 18px;
  letter-spacing: 0.1em;
  pointer-events: none;
  transition: opacity 1s;
}
</style>
</head>
<body>
<div id="hint">うごかしてね ☂</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let mx = -999, my = -999;
let moved = false;

const UMBRELLA_W = 130;
const UMBRELLA_H = 70;
const HANDLE_LEN = 80;

const RAIN_COLORS = ['#a0c8ff','#c8e0ff','#e0f0ff','#ffffff'];
const SPARK_COLORS = ['#ffe066','#ff9fd4','#a0f0c8','#c084fc','#60d0ff','#ffb347'];

let raindrops = [];
let sparks = [];
let splashes = [];

function mkRain() {
  return {
    x: Math.random() * (W + 100) - 50,
    y: -20,
    len: 14 + Math.random() * 18,
    speed: 6 + Math.random() * 5,
    color: RAIN_COLORS[Math.floor(Math.random() * RAIN_COLORS.length)],
    alpha: 0.5 + Math.random() * 0.5,
  };
}

for (let i = 0; i < 80; i++) {
  const d = mkRain();
  d.y = Math.random() * H;
  raindrops.push(d);
}

function mkSpark(x, y) {
  for (let i = 0; i < 10; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    sparks.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      color: SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)],
      r: 3 + Math.random() * 4,
      life: 1,
    });
  }
}

function mkSplash(x, y) {
  splashes.push({ x, y, r: 2, life: 1 });
}

function pointInUmbrella(px, py, ux, uy) {
  const dx = px - ux;
  const dy = py - uy;
  if (dy < -6 || dy > UMBRELLA_H + 6) return false;
  const halfW = (UMBRELLA_W / 2) * (1 - dy / (UMBRELLA_H * 1.4));
  return Math.abs(dx) < halfW + 6;
}

function drawUmbrella(x, y) {
  ctx.save();

  ctx.beginPath();
  ctx.moveTo(x - UMBRELLA_W / 2, y + UMBRELLA_H * 0.3);
  ctx.quadraticCurveTo(x, y - UMBRELLA_H * 0.5, x + UMBRELLA_W / 2, y + UMBRELLA_H * 0.3);
  ctx.lineTo(x + UMBRELLA_W / 2, y + UMBRELLA_H * 0.3);
  ctx.quadraticCurveTo(x, y + UMBRELLA_H * 0.6, x - UMBRELLA_W / 2, y + UMBRELLA_H * 0.3);
  ctx.closePath();
  ctx.fillStyle = '#e8405a';
  ctx.fill();

  const stripeW = UMBRELLA_W / 6;
  for (let i = 0; i < 6; i++) {
    const sx = x - UMBRELLA_W / 2 + i * stripeW;
    ctx.save();
    ctx.clip();
    ctx.beginPath();
    ctx.moveTo(sx + stripeW / 2, y - UMBRELLA_H * 0.5);
    ctx.lineTo(sx + stripeW, y + UMBRELLA_H * 0.3);
    ctx.lineTo(sx, y + UMBRELLA_H * 0.3);
    ctx.closePath();
    ctx.fillStyle = i % 2 === 0 ? '#c82040' : '#ff6080';
    ctx.fill();
    ctx.restore();
  }

  ctx.beginPath();
  ctx.moveTo(x - UMBRELLA_W / 2, y + UMBRELLA_H * 0.3);
  ctx.quadraticCurveTo(x, y - UMBRELLA_H * 0.5, x + UMBRELLA_W / 2, y + UMBRELLA_H * 0.3);
  ctx.quadraticCurveTo(x, y + UMBRELLA_H * 0.6, x - UMBRELLA_W / 2, y + UMBRELLA_H * 0.3);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x, y - UMBRELLA_H * 0.5 + 6, 7, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x, y + UMBRELLA_H * 0.4);
  ctx.lineTo(x, y + UMBRELLA_H * 0.4 + HANDLE_LEN - 20);
  ctx.quadraticCurveTo(x, y + UMBRELLA_H * 0.4 + HANDLE_LEN + 6, x + 22, y + UMBRELLA_H * 0.4 + HANDLE_LEN + 6);
  ctx.strokeStyle = '#8B5C2A';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.restore();
}

function drawBackground() {
  ctx.fillStyle = '#1a2a4a';
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 5; i++) {
    const cx = (W * 0.1) + i * (W * 0.22);
    const cy = H * 0.18 + Math.sin(i * 1.3) * H * 0.05;
    const r = 60 + i * 18;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(80,100,140,0.35)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + r * 0.5, cy - r * 0.2, r * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx - r * 0.4, cy - r * 0.1, r * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(60,80,110,0.5)';
  ctx.fillRect(0, H * 0.85, W, H * 0.15);
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.arc(W * 0.08 + i * W * 0.17, H * 0.85, 28 + i * 6, Math.PI, 0);
    ctx.fill();
  }
}

let frame = 0;

function loop() {
  frame++;
  ctx.clearRect(0, 0, W, H);
  drawBackground();

  const ux = mx, uy = my;

  raindrops.forEach((d, i) => {
    d.y += d.speed;
    d.x += 1.2;

    const hit = pointInUmbrella(d.x, d.y, ux, uy);
    if (hit) {
      mkSpark(d.x, d.y);
      raindrops[i] = mkRain();
      return;
    }
    if (d.y > H + 20) {
      mkSplash(d.x, H * 0.86);
      raindrops[i] = mkRain();
      return;
    }

    ctx.save();
    ctx.globalAlpha = d.alpha;
    ctx.strokeStyle = d.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - d.len * 0.18, d.y - d.len);
    ctx.stroke();
    ctx.restore();
  });

  sparks = sparks.filter(s => {
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.18;
    s.life -= 0.03;
    if (s.life <= 0) return false;
    ctx.save();
    ctx.globalAlpha = s.life;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * s.life, 0, Math.PI * 2);
    ctx.fillStyle = s.color;
    ctx.fill();
    ctx.restore();
    return true;
  });

  splashes = splashes.filter(s => {
    s.r += 2.5;
    s.life -= 0.06;
    if (s.life <= 0) return false;
    ctx.save();
    ctx.globalAlpha = s.life * 0.4;
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, s.r, s.r * 0.35, 0, 0, Math.PI * 2);
    ctx.strokeStyle = '#a0c8ff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
    return true;
  });

  if (mx > 0) drawUmbrella(ux, uy);

  if (mx < 0 && frame % 120 === 0) {
    const ax = W * 0.3 + Math.random() * W * 0.4;
    const ay = H * 0.3 + Math.random() * H * 0.3;
    drawUmbrella(ax, ay);
  }

  requestAnimationFrame(loop);
}
loop();

function updatePos(x, y) {
  mx = x; my = y;
  if (!moved) {
    moved = true;
    hint.style.opacity = '0';
  }
}

canvas.addEventListener('mousemove', e => updatePos(e.clientX, e.clientY));
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  updatePos(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  updatePos(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
</script>
</body>
</html>
