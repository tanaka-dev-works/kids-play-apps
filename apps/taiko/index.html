<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たいこをたたけ！</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #1a0a2e;
  width: 100vw; height: 100vh;
  overflow: hidden;
  font-family: 'Hiragino Maru Gothic Pro', 'BIZ UDPGothic', sans-serif;
  user-select: none;
}
canvas { display: block; }
#hint {
  position: absolute;
  bottom: 36px; left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.4);
  font-size: 20px;
  letter-spacing: 0.12em;
  pointer-events: none;
  transition: opacity 1.2s;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">たたいてね！</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
let hintGone = false;

let W, H, CX, CY;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2; CY = H / 2;
}
resize();
window.addEventListener('resize', resize);

const DRUM_R = Math.min(window.innerWidth, window.innerHeight) * 0.22;

const HIT_COLORS = [
  '#ff6eb4','#ff9f40','#facc15','#34d399','#60a5fa','#c084fc','#f87171','#38bdf8'
];

let rings = [];
let stars = [];
let shakeAmt = 0;
let bgHue = 260;
let combo = 0;
let comboAlpha = 0;
let comboScale = 1;
let drumScale = 1;
let drumColor = 0;
let lastColors = [];

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;

function getAudioCtx() {
  if (!actx) actx = new AudioCtx();
  return actx;
}

function playDon(intensity) {
  try {
    const ac = getAudioCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    const osc2 = ac.createOscillator();
    const gain2 = ac.createGain();

    osc.connect(gain); gain.connect(ac.destination);
    osc2.connect(gain2); gain2.connect(ac.destination);

    const freq = 80 + intensity * 20;
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, ac.currentTime + 0.4);
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.7, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.5);
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + 0.5);

    osc2.frequency.setValueAtTime(freq * 2.5, ac.currentTime);
    osc2.type = 'triangle';
    gain2.gain.setValueAtTime(0.3, ac.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.18);
    osc2.start(ac.currentTime);
    osc2.stop(ac.currentTime + 0.2);
  } catch(e) {}
}

function pickColor() {
  let c;
  do { c = HIT_COLORS[Math.floor(Math.random() * HIT_COLORS.length)]; }
  while (lastColors.includes(c));
  lastColors.push(c);
  if (lastColors.length > 3) lastColors.shift();
  return c;
}

function onHit(x, y) {
  if (!hintGone) { hint.style.opacity = '0'; hintGone = true; }

  const dx = x - CX, dy = y - CY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const onDrum = dist < DRUM_R + 30;

  combo++;
  const color = pickColor();
  drumColor = color;
  drumScale = 0.92;
  shakeAmt = onDrum ? 10 : 4;
  bgHue = (bgHue + 40) % 360;

  playDon(Math.min(combo, 5));

  for (let i = 0; i < 5; i++) {
    rings.push({
      x: CX, y: CY,
      r: DRUM_R * 0.5,
      maxR: DRUM_R * (1.4 + i * 0.35 + Math.random() * 0.3),
      color,
      alpha: 0.9 - i * 0.12,
      speed: 5 + i * 2,
    });
  }

  const starCount = onDrum ? 18 : 8;
  for (let i = 0; i < starCount; i++) {
    const angle = (Math.PI * 2 * i / starCount) + Math.random() * 0.4;
    const speed = onDrum ? (4 + Math.random() * 8) : (2 + Math.random() * 4);
    stars.push({
      x: CX, y: CY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - (onDrum ? 3 : 1),
      color,
      r: onDrum ? (5 + Math.random() * 8) : (3 + Math.random() * 5),
      life: 1,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.2,
    });
  }

  comboAlpha = 1;
  comboScale = 1.5;
}

function drawStar5(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = rot + (Math.PI * 2 * i / 5) - Math.PI / 2;
    const ai = a + Math.PI / 5;
    i === 0 ? ctx.moveTo(x + Math.cos(a)*r, y + Math.sin(a)*r)
            : ctx.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
    ctx.lineTo(x + Math.cos(ai)*r*0.4, y + Math.sin(ai)*r*0.4);
  }
  ctx.closePath();
}

function drawDrum(sx, sy) {
  const r = DRUM_R;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(drumScale, drumScale);

  ctx.beginPath();
  ctx.ellipse(0, r * 0.12, r, r * 0.14, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#5a1a00';
  ctx.fill();

  ctx.beginPath();
  ctx.rect(-r, -r * 0.12, r * 2, r * 0.24);
  ctx.fillStyle = '#7a2800';
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(0, 0, r, r * 0.14, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#9a3400';
  ctx.fill();

  const rimColor = drumColor || '#c8181a';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = rimColor;
  ctx.fill();

  const grad = ctx.createRadialGradient(-r*0.2, -r*0.2, r*0.05, 0, 0, r);
  grad.addColorStop(0, 'rgba(255,255,255,0.22)');
  grad.addColorStop(0.6, 'rgba(255,255,255,0.0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, r * 0.62, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 2;
  ctx.stroke();

  for (let i = 0; i < 8; i++) {
    const a = (Math.PI * 2 * i / 8);
    const ix = Math.cos(a) * r * 0.88, iy = Math.sin(a) * r * 0.88;
    ctx.beginPath();
    ctx.arc(ix, iy, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#c8a040';
    ctx.fill();
  }

  ctx.restore();
}

function drawBackground() {
  ctx.fillStyle = `hsl(${bgHue},40%,8%)`;
  ctx.fillRect(0, 0, W, H);
}

let frame = 0;
function loop() {
  frame++;
  const sx = CX + (Math.random() - 0.5) * shakeAmt;
  const sy = CY + (Math.random() - 0.5) * shakeAmt;
  shakeAmt *= 0.82;
  drumScale += (1 - drumScale) * 0.18;

  drawBackground();

  rings = rings.filter(rng => {
    rng.r += rng.speed;
    rng.alpha -= 0.022;
    if (rng.alpha <= 0) return false;
    ctx.save();
    ctx.globalAlpha = rng.alpha;
    ctx.beginPath();
    ctx.arc(rng.x, rng.y, rng.r, 0, Math.PI * 2);
    ctx.strokeStyle = rng.color;
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.restore();
    return rng.r < rng.maxR;
  });

  drawDrum(sx, sy);

  stars = stars.filter(s => {
    s.x += s.vx; s.y += s.vy;
    s.vy += 0.22; s.vx *= 0.97;
    s.life -= 0.025;
    s.rot += s.rotV;
    if (s.life <= 0) return false;
    ctx.save();
    ctx.globalAlpha = s.life;
    ctx.fillStyle = s.color;
    drawStar5(s.x, s.y, s.r * s.life + s.r * 0.3, s.rot);
    ctx.fill();
    ctx.restore();
    return true;
  });

  if (combo > 1 && comboAlpha > 0) {
    comboScale += (1 - comboScale) * 0.15;
    comboAlpha -= 0.025;
    ctx.save();
    ctx.globalAlpha = Math.max(0, comboAlpha);
    ctx.font = `${Math.round(comboScale * 52)}px 'Hiragino Maru Gothic Pro', sans-serif`;
    ctx.fillStyle = drumColor || '#facc15';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const label = combo >= 10 ? `${combo}かい！！` : combo >= 5 ? `${combo}かい！` : `${combo}かい`;
    ctx.fillText(label, CX, CY - DRUM_R * 1.5);
    ctx.restore();
  }

  requestAnimationFrame(loop);
}
loop();

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  if (e.touches) return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('mousedown', e => { const p = getPos(e); onHit(p.x, p.y); });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (let t of e.touches) onHit(t.clientX, t.clientY);
}, { passive: false });
</script>
</body>
</html>
