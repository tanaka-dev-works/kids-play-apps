<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>くらい うみの たんけん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* layout: 画面いっぱいの海(canvas)。音量ボタンは右上、深さメーターは左端、スタートと図鑑は中央に重ねる */
:root{
  --abyss:#030a17;
  --deep:#0b2744;
  --lamp:#ffd35c;
  --lamp-deep:#e59f00;
  --foam:#e8f6ff;
  --mist:#9fc3dc;
  --panel:rgba(6,20,40,0.92);
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;
  --font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--foam);font-family:var(--font-body);overflow:hidden;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#sea{position:fixed;inset:0;display:block;touch-action:none}
#sea.playing{cursor:none}

.round-btn{appearance:none;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:rgba(8,30,56,0.72);color:var(--foam);box-shadow:0 0 0 2px rgba(232,246,255,0.25) inset}
.round-btn:focus-visible,.play:focus-visible{outline:4px solid var(--lamp);outline-offset:4px}

.vol{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:64px;height:64px;z-index:5}
.vol svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.vol .spk{fill:currentColor}
.vol .w1,.vol .w2,.vol .mute{display:none}
.vol[data-level="0"] .w1,.vol[data-level="0"] .w2,.vol[data-level="1"] .w1,.vol[data-level="2"] .mute{display:inline}

.start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:min(28px,4vh);
  padding-inline:16px;padding-block:16px;box-sizing:border-box;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 40%,rgba(11,39,68,0.55),rgba(3,10,23,0.92) 70%);
  transition:opacity .6s ease}
.start.gone{opacity:0;pointer-events:none}
.start-inner{display:flex;flex-direction:column;align-items:center;gap:min(28px,4vh);text-align:center}
.start h1{margin:0;font-family:var(--font-display);font-weight:900;font-size:clamp(30px,min(9vw,11vh),88px);line-height:1.15;
  letter-spacing:0.06em;text-wrap:balance;color:var(--foam);text-shadow:0 0 28px rgba(255,211,92,0.35)}
.start h1 span{color:var(--lamp)}
.play{appearance:none;border:0;cursor:pointer;width:clamp(88px,20vh,132px);height:clamp(88px,20vh,132px);flex:none;border-radius:50%;display:grid;place-items:center;
  background:var(--lamp);color:var(--abyss);box-shadow:0 0 0 10px rgba(255,211,92,0.18),0 0 60px rgba(255,211,92,0.55);
  animation:breathe 2.4s ease-in-out infinite}
.play svg{width:64px;height:64px;fill:currentColor;margin-left:8px}
.note{margin:0;font-size:18px;font-weight:700;line-height:1.8;color:var(--mist)}
.parent{margin:0;max-width:640px;font-size:12px;line-height:1.7;color:rgba(159,195,220,0.8);text-align:center}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;z-index:6;display:flex;align-items:center;gap:12px;
  padding:8px 22px 8px 10px;border-radius:999px;background:var(--panel);box-shadow:0 0 0 3px var(--lamp) inset,0 8px 30px rgba(0,0,0,0.4);
  transform:translateX(-50%);pointer-events:none}
.toast.show{animation:toast 2.8s ease forwards}
.toast canvas{width:64px;height:64px;border-radius:50%;background:#0d2c4d}
.toast span{font-family:var(--font-display);font-weight:900;font-size:24px;letter-spacing:0.04em;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-24px) scale(.9)}10%,82%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-12px) scale(.96)}}

.zukan{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding-inline:16px;background:rgba(2,7,18,0.7)}
.zukan-panel{width:100%;max-width:880px;max-height:88vh;overflow-y:auto;border-radius:28px;background:var(--panel);
  box-shadow:0 0 0 3px rgba(255,211,92,0.55) inset,0 20px 60px rgba(0,0,0,0.5);padding:20px 20px 28px;box-sizing:border-box}
.zukan-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.zukan-head h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:clamp(22px,4vw,32px);letter-spacing:0.05em;flex:1;min-width:0}
.zukan-head p{margin:0;font-weight:700;color:var(--lamp);font-size:18px}
.zukan-close{width:60px;height:60px;font-size:34px;line-height:1;font-weight:700}
.zukan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:14px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:20px;background:rgba(13,44,77,0.7)}
.card canvas{width:100px;height:100px}
.card b{font-size:15px;font-weight:700;text-align:center;line-height:1.3;min-height:2.6em;display:grid;place-items:center}
.card.no b{color:rgba(159,195,220,0.5)}
.card i{font-style:normal;font-size:10px;font-weight:700;white-space:nowrap;color:var(--abyss);background:var(--lamp);border-radius:999px;padding:1px 6px}
.zone{grid-column:1/-1;margin:10px 0 -4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  font-family:var(--font-display);font-weight:900;font-size:18px;letter-spacing:0.05em;color:var(--foam)}
.zone:first-child{margin-top:0}
.zone small{font-family:var(--font-body);font-weight:700;font-size:13px;letter-spacing:0;color:var(--mist)}
.card{position:relative}
.card:not(.no){cursor:pointer}
.card.kira{box-shadow:0 0 0 3px var(--lamp) inset,0 0 18px rgba(255,211,92,0.35)}
.card .star{position:absolute;top:6px;right:9px;font-size:18px;line-height:1;color:var(--lamp);text-shadow:0 0 8px rgba(255,211,92,0.9)}
.toast.kira{background:linear-gradient(90deg,#4a3000,#7a5200 50%,#4a3000);box-shadow:0 0 0 3px #ffe27a inset,0 0 34px rgba(255,220,120,0.65)}

.dress{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:90px;width:64px;height:64px;z-index:5}
.dress svg{width:36px;height:36px}
.dress-panel{max-width:560px}
#dressPreview{display:block;width:100%;max-width:340px;height:150px;margin:0 auto;border-radius:22px;
  background:radial-gradient(ellipse at 40% 50%,#0e3c63,#04101f 75%)}
.dress-row{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.dress-row h3{margin:0;font-family:var(--font-display);font-weight:900;font-size:18px;letter-spacing:0.05em}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.swatch{appearance:none;border:0;width:56px;height:56px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 3px rgba(232,246,255,0.25) inset}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 4px var(--lamp),0 0 0 8px rgba(255,211,92,0.3)}
.swatch:focus-visible,.done:focus-visible{outline:4px solid var(--foam);outline-offset:4px}
.done{appearance:none;border:0;cursor:pointer;display:block;margin:24px auto 0;padding:12px 44px;border-radius:999px;
  background:var(--lamp);color:var(--abyss);font-family:var(--font-display);font-weight:900;font-size:22px;letter-spacing:0.05em}

@media (prefers-reduced-motion:reduce){.play{animation:none}.toast.show{animation-duration:3.2s}}
</style>

<canvas id="sea" aria-label="くらい うみ。マウスで せんすいかんを うごかして いきものを さがそう"></canvas>

<button id="vol" class="round-btn vol" data-level="1" aria-label="おと: ちいさめ" hidden>
  <svg viewBox="0 0 48 48" aria-hidden="true"><path class="spk" d="M7 19h8l11-9v28l-11-9H7z"/><path class="w1" d="M31 18c3.5 3.5 3.5 8.5 0 12"/><path class="w2" d="M36 13c6.5 6.5 6.5 15.5 0 22"/><path class="mute" d="M31 19l10 10M41 19L31 29"/></svg>
</button>

<button id="dress" class="round-btn dress" aria-label="せんすいかんの きせかえ" hidden>
  <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M24 6C13 6 5 13.6 5 23c0 8.6 6.7 15 14 15 2.6 0 3.6-1.6 3.6-3.4 0-2.6-2-3-2-5 0-1.7 1.4-3 3.4-3H29c7.7 0 14-4.4 14-11.6C43 12 34.6 6 24 6z"/><circle cx="14" cy="22" r="3.4" fill="#ff6b6b"/><circle cx="20" cy="14" r="3.4" fill="#ffd35c"/><circle cx="30" cy="13" r="3.4" fill="#62d68e"/><circle cx="36" cy="21" r="3.4" fill="#5aaeff"/></svg>
</button>

<div id="dressBox" class="zukan" hidden role="dialog" aria-modal="true" aria-labelledby="dressTitle">
  <div class="zukan-panel dress-panel">
    <div class="zukan-head">
      <h2 id="dressTitle">せんすいかんの きせかえ</h2>
      <button id="dressClose" class="round-btn zukan-close" aria-label="とじる">×</button>
    </div>
    <canvas id="dressPreview" aria-hidden="true"></canvas>
    <div class="dress-row"><h3>からだの いろ</h3><div id="bodySw" class="swatches"></div></div>
    <div class="dress-row"><h3>ライトの いろ</h3><div id="lightSw" class="swatches"></div></div>
    <button id="dressDone" class="done">できた!</button>
  </div>
</div>

<div id="toast" class="toast" hidden aria-live="polite"><canvas id="toastIcon"></canvas><span id="toastName"></span></div>

<div id="zukan" class="zukan" hidden role="dialog" aria-modal="true" aria-labelledby="zukanTitle">
  <div class="zukan-panel">
    <div class="zukan-head">
      <h2 id="zukanTitle">うみの いきもの ずかん</h2>
      <p id="zukanCount"></p>
      <button id="zukanClose" class="round-btn zukan-close" aria-label="とじる">×</button>
    </div>
    <div id="zukanGrid" class="zukan-grid"></div>
  </div>
</div>

<div id="start" class="start">
  <div class="start-inner">
    <h1>くらい うみの<br><span>たんけん</span></h1>
    <button id="play" class="play" aria-label="あそぶ"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M15 9l24 15-24 15z"/></svg></button>
    <p class="note">マウスを うごかすと ライトが うごくよ<br>クリックすると あわが でるよ</p>
  </div>
  <p class="parent">おうちの方へ：押すと全画面で始まります。Escキー（Chrome・Edgeでは長押し）で全画面を終了できます。右上のボタンで音の大きさを「普通・小さめ・消音」に切り替えられます。</p>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (k, dt) => 1 - Math.pow(k, dt);

const $ = id => document.getElementById(id);
const cv = $('sea'), ctx = cv.getContext('2d');
const startEl = $('start'), volBtn = $('vol'), toast = $('toast'), toastIcon = $('toastIcon'), toastName = $('toastName');
const zukanEl = $('zukan'), zukanGrid = $('zukanGrid'), zukanCount = $('zukanCount');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = getComputedStyle(document.documentElement).getPropertyValue('--font-body');

// 海の層。深さは本物の生きものの すみかに だいたい 合わせている
const ZONES = [
  { name: 'あさい うみ', range: '0〜200m' },
  { name: 'うすぐらい うみ', range: '200〜1000m' },
  { name: 'まっくらな うみ', range: '1000〜3000m' },
  { name: 'いちばん ふかい うみ', range: '3000〜4000m' },
];
const TYPES = [
  { id: 'fish', name: 'さかな', z: 0 },
  { id: 'clown', name: 'くまのみ', z: 0 },
  { id: 'seahorse', name: 'たつのおとしご', z: 0 },
  { id: 'turtle', name: 'うみがめ', z: 0 },
  { id: 'star', name: 'ひとで', z: 0 },
  { id: 'eel', name: 'ちんあなご', z: 0 },
  { id: 'crab', name: 'かに', z: 0 },
  { id: 'puffer', name: 'ふぐ', z: 0 },
  { id: 'octo', name: 'たこ', z: 0 },
  { id: 'dolphin', name: 'いるか', z: 0 },
  { id: 'manta', name: 'まんた', z: 0 },
  { id: 'whaleshark', name: 'じんべえざめ', z: 0 },
  { id: 'jelly', name: 'くらげ', z: 1 },
  { id: 'squid', name: 'ほたるいか', z: 1 },
  { id: 'spider', name: 'たかあしがに', z: 1 },
  { id: 'coela', name: 'しーらかんす', z: 1 },
  { id: 'barrel', name: 'でめにぎす', z: 1 },
  { id: 'vampire', name: 'こうもりだこ', z: 1 },
  { id: 'dumbo', name: 'めんだこ', z: 1 },
  { id: 'oarfish', name: 'りゅうぐうのつかい', z: 1 },
  { id: 'whale', name: 'くじら', z: 1 },
  { id: 'giantsquid', name: 'だいおういか', z: 1 },
  { id: 'goblin', name: 'みつくりざめ', z: 1 },
  { id: 'frilled', name: 'らぶか', z: 1 },
  { id: 'angler', name: 'ちょうちんあんこう', z: 2 },
  { id: 'fang', name: 'おにきんめ', z: 2 },
  { id: 'isopod', name: 'だいおうぐそくむし', z: 2 },
  { id: 'pelican', name: 'ぺりかんうなぎ', z: 2 },
  { id: 'halo', name: 'とかげぎす', z: 2 },
  { id: 'seapig', name: 'せんじゅなまこ', z: 3 },
  { id: 'tripod', name: 'ながづええそ', z: 3 },
  { id: 'leviathan', name: 'りばいあさん', z: 3, myth: true },
];
const PENTA = [392, 440, 523, 587, 659, 784, 880, 1047, 1175, 1319];
TYPES.forEach((t, i) => { t.note = PENTA[i % PENTA.length]; });
const TYPE = Object.fromEntries(TYPES.map(t => [t.id, t]));

// 図鑑は次に遊ぶときも残す(保存できない環境ではその回だけ)
let found = {};
try { found = JSON.parse(localStorage.getItem('kurai-umi-zukan') || '{}') || {}; } catch (e) { found = {}; }
const saveFound = () => { try { localStorage.setItem('kurai-umi-zukan', JSON.stringify(found)); } catch (e) {} };
const sessionFound = {};

// せんすいかんの 着せかえ。からだは [からだ, とう, おび, こい色]
const BODY = [
  { name: 'きいろ', c: ['#ffcc29', '#f2b705', '#f29e05', '#b07a00'] },
  { name: 'あか', c: ['#ff6b6b', '#e84f4f', '#d23a3a', '#962424'] },
  { name: 'あお', c: ['#5aaeff', '#3d93ea', '#2f77cc', '#1f4f8a'] },
  { name: 'みどり', c: ['#62d68e', '#45ba74', '#38a062', '#226b3f'] },
  { name: 'ぴんく', c: ['#ff9bcd', '#f57bb5', '#e05a9c', '#a33a6c'] },
  { name: 'むらさき', c: ['#b894ff', '#9d74f2', '#8458db', '#583a99'] },
  { name: 'しろ', c: ['#f2f5f8', '#d9e0e7', '#c3ccd6', '#7d8a98'] },
];
const LIGHT = [
  { name: 'しろ', rgb: '255,240,190' },
  { name: 'きいろ', rgb: '255,205,80' },
  { name: 'あお', rgb: '120,200,255' },
  { name: 'ぴんく', rgb: '255,140,205' },
  { name: 'みどり', rgb: '130,255,170' },
];
const look = { body: 0, light: 0 };
try { Object.assign(look, JSON.parse(localStorage.getItem('kurai-umi-look') || '{}')); } catch (e) {}
look.body = clamp(look.body | 0, 0, BODY.length - 1); look.light = clamp(look.light | 0, 0, LIGHT.length - 1);
const saveLook = () => { try { localStorage.setItem('kurai-umi-look', JSON.stringify(look)); } catch (e) {} };

/* ---------- おと ---------- */
const sfx = (() => {
  let ac = null, master = null, amb = null, lv = 1;
  const LEVELS = [0.55, 0.22, 0];
  function tone(f, dur, o = {}) {
    if (!ac) return;
    const t0 = ac.currentTime + (o.at || 0), osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t0 + (o.attack || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function ambient() {
    // 低くこもった水の音(ブラウンノイズ)をゆっくり波打たせる
    const len = ac.sampleRate * 4, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    let l = 0;
    for (let i = 0; i < len; i++) { l = (l + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = l * 3.5; }
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 480;
    const g = ac.createGain(); g.gain.value = 0.1;
    const lfo = ac.createOscillator(), lg = ac.createGain();
    lfo.frequency.value = 0.08; lg.gain.value = 0.05; lfo.connect(lg); lg.connect(g.gain); lfo.start();
    src.connect(lp); lp.connect(g); g.connect(master); src.start();
    amb = lp;
  }
  return {
    init() {
      if (ac) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC(); master = ac.createGain(); master.gain.value = LEVELS[lv]; master.connect(ac.destination);
      ambient();
    },
    resume() { if (ac && ac.state === 'suspended') ac.resume(); },
    get level() { return lv; },
    kira() {
      [0, 4, 7, 11, 14, 19].forEach((s, i) => tone(1047 * Math.pow(2, s / 12), 0.6, { at: i * 0.06, vol: 0.1 }));
      tone(2093, 1.2, { at: 0.42, vol: 0.06, type: 'triangle' });
    },
    cycle() { lv = (lv + 1) % 3; if (master) master.gain.setTargetAtTime(LEVELS[lv], ac.currentTime, 0.05); return lv; },
    depth(f) { if (amb) amb.frequency.setTargetAtTime(480 - 340 * f, ac.currentTime, 0.6); },
    pop() { tone(rand(380, 520), 0.12, { to: rand(900, 1200), vol: 0.16 }); },
    tiny() { tone(rand(900, 1300), 0.06, { to: 1800, vol: 0.05 }); },
    blip(f) { tone(f, 0.4, { type: 'triangle', vol: 0.1 }); },
    swish() { tone(700, 0.25, { to: 250, vol: 0.08, type: 'triangle' }); },
    chime() { [0, 4, 7, 12].forEach((s, i) => tone(784 * Math.pow(2, s / 12), 0.8, { at: i * 0.09, vol: 0.14 })); },
    whale() { tone(210, 1.6, { to: 140, vol: 0.2, attack: 0.5 }); tone(150, 2, { at: 1.3, to: 230, vol: 0.16, attack: 0.6 }); },
    fanfare() {
      [0, 4, 7, 12, 16].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.5, { type: 'triangle', at: i * 0.11, vol: 0.14 }));
      tone(1046, 1.4, { at: 0.6, vol: 0.1 });
    },
    rumble() { tone(70, 2.6, { type: 'triangle', to: 46, vol: 0.32, attack: 0.9 }); tone(140, 2.2, { at: 0.4, to: 105, vol: 0.12, attack: 0.7 }); },
    click() { [0, 0.07, 0.14, 0.21].forEach(at => tone(2300, 0.05, { at, to: 3200, vol: 0.05 })); },
  };
})();

/* ---------- よみあげ(ブラウザの 読み上げ機能。日本語の声が ないときは 何もしない) ---------- */
const voice = (() => {
  const ss = window.speechSynthesis;
  let ja = null;
  const pickVoice = () => {
    try {
      const vs = ss.getVoices().filter(v => /^ja/i.test(v.lang));
      // ネットに つながっていれば なめらかな声、つながっていなければ パソコンに 入っている声
      ja = (navigator.onLine && vs.find(v => /natural|nanami/i.test(v.name))) || vs.find(v => v.localService) || vs[0] || null;
    } catch (e) { ja = null; }
  };
  if (ss) { pickVoice(); try { ss.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
  return {
    say(text) {
      if (!ss || sfx.level === 2) return;
      try {
        pickVoice(); ss.cancel();

/* ---------- うみの せかい ---------- */
let W = 0, H = 0, DPR = 1, S = 1, WH = 0, R = 150;
let camY = 0, T = 0, started = false, startT = 0, hasDived = false, zukanOpen = false;
let px = 0, py = 0;
const held = {};
const sub = { x: 0, y: 0, dir: 1, tilt: 0, vx: 0, vy: 0 };
let creatures = [], rocks = [], weeds = [], snow = [], pebbles = [], bubbles = [], sparks = [];
let chest = { x: 0, y: 0, open: 0, target: 0 };
let ledges = [], visitors = [], visitTimer = 6, diveHold = 0, blipCool = 0, popCool = 0;
const SPARK = ['#fff3a3', '#aef3ff', '#ffc6e8', '#c8ffb0'];

// 深さ(m)と 世界の たて位置。浅いところほど ゆったり 広くとる
const MAXD = 4000;
const floorY = () => WH - H * 0.14;
const yAt = m => floorY() * Math.sqrt(clamp(m, 0, MAXD) / MAXD);
const mAt = y => MAXD * Math.pow(clamp(y / floorY(), 0, 1), 2);
const ledgeX = (l, u) => l.side < 0 ? u * l.w * W : W - u * l.w * W;

function mkRock(x, y, r0) {
  const j = []; for (let i = 0; i < 10; i++) j.push(rand(0.74, 1.08));
  const f = clamp(y / WH, 0, 1);
  return { x, y, r0, j, col: `hsl(${205 + f * 25} ${24 - f * 8}% ${30 - f * 15}%)` };
}
function mk(type, x, y, o) {
  const c = Object.assign({ type, x, y, hx: x, hy: y, s: 1, k: S, dir: Math.random() < 0.5 ? 1 : -1, ph: rand(0, TAU),
    st: 0, lit: false, cool: 0, vx: 0, vy: 0, lx: 0, ly: 0, hit: 20 }, o || {});
  creatures.push(c); return c;
}

function build() {
  creatures = []; rocks = []; weeds = []; snow = []; pebbles = []; ledges = []; visitors = [];
  const F = floorY();
  // 底に すむ 生きものの ための 岩だな
  [[25, -1], [300, 1], [750, -1], [1500, 1]].forEach(([m, side]) => ledges.push({ y: yAt(m), side, w: W < 600 ? 0.58 : 0.46 }));
  for (let i = 0; i < 72; i++) {
    const left = i % 2 === 0, y = F * (0.03 + 0.94 * i / 72) + rand(-0.2, 0.2) * H;
    if (ledges.some(l => (l.side < 0) === left && y > l.y - H * 0.35 && y < l.y + H * 0.8)) continue;
    rocks.push(mkRock(left ? rand(-0.03, 0.05) * W : rand(0.95, 1.03) * W, y, rand(80, 130)));
  }
  const weed = (x, y) => weeds.push({ x, y, len: rand(60, 130), ph: rand(0, TAU), hue: rand(95, 150) });
  rocks.forEach(r => {
    if (mAt(r.y) > 150) return;
    const n = 3 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) weed(r.x + rand(-0.5, 0.5) * r.r0 * S, r.y - r.r0 * S * rand(0.55, 0.8));
  });
  const [L0, L1, L2, L3] = ledges;
  for (let i = 0; i < 7; i++) weed(ledgeX(L0, rand(0.05, 0.95)), L0.y - 4 * S);

  const at = (m1, m2, x1 = 0.15, x2 = 0.85) => [rand(x1, x2) * W, yAt(rand(m1, m2))];
  const some = (a, b) => a + (Math.random() * (b - a + 1) | 0);   // 数も 毎回 かわる

  // あさい うみ(0〜200m)
  const fishCols = ['#ff9f43', '#4dd2ff', '#ff6b9d', '#ffe066', '#7bed9f', '#b197fc'];
  fishCols.forEach((col, si) => {
    const [cx, cy] = at(3 + si * 22, 15 + si * 25, 0.25, 0.75), n = some(4, 8);
    for (let i = 0; i < n; i++) mk('fish', cx + rand(-80, 80) * S, cy + rand(-50, 50) * S,
      { col, s: rand(0.8, 1.2), w: rand(0.3, 0.5), rx: rand(60, 140), ry: rand(25, 60), bored: 0, hit: 14 });
  });
  for (let i = some(1, 3); i > 0; i--) { const [x, y] = at(5, 60, 0, 1); mk('turtle', x, y, { s: 1.5, sp: rand(28, 40), hit: 34 }); }
  for (let i = some(2, 4); i > 0; i--) { const [x, y] = at(8, 40, 0.1, 0.9); mk('seahorse', x, y, { col: pick(['#ffb347', '#ffd166', '#f78fb3']), s: 1.1, hit: 18 }); }
  const starCols = ['#ff7b54', '#ffb4a2', '#c77dff', '#ffd166'];
  rocks.filter(r => mAt(r.y) < 300).forEach(r => {
    if (Math.random() < 0.45) return;
    const side = r.x < W / 2 ? 1 : -1;
    mk('star', r.x + side * r.r0 * S * 0.5, r.y - r.r0 * S * 0.5, { col: pick(starCols), s: rand(0.9, 1.2), rot: rand(-0.3, 0.3), hit: 18 });
  });
  for (let i = some(2, 4); i > 0; i--) { const [x, y] = at(15, 150, 0.25, 0.75); mk('puffer', x, y, { s: 1.3, hit: 22 }); }
  rocks.filter(r => mAt(r.y) > 30 && mAt(r.y) < 200).sort(() => Math.random() - 0.5).slice(0, 3).forEach(r => {
    const side = r.x < W / 2 ? 1 : -1, hx = r.x + side * r.r0 * S * 0.72, hy = r.y - r.r0 * S * 0.1;
    mk('octo', hx, hy, { ox: hx + side * 75 * S, oy: hy - 30 * S, hue: pick([6, 18, 340]), s: 1.3, hit: 45 });
  });
  { // 25mの すなの たな: くまのみ・ちんあなご・かに
    const ax = ledgeX(L0, 0.62), ay = L0.y - 2 * S;
    for (let i = some(2, 3); i > 0; i--) mk('clown', ax + rand(-30, 30) * S, ay - 40 * S, { ax, ay, s: 1, hit: 14 });
    mk('anemone', ax, ay, { s: 1.3 });
    const ex = ledgeX(L0, 0.3);
    for (let i = 0; i < 7; i++) mk('eel', ex + (i - 3) * 22 * S, L0.y + 2 * S,
      { col: i % 2 ? '#f4f1e8' : '#ff9f1c', pat: i % 2 ? 'spot' : 'stripe', out: 1, s: 1, hit: 12 });
    for (let i = some(1, 2); i > 0; i--) mk('crab', ledgeX(L0, rand(0.78, 0.9)), L0.y - 18 * 1.2 * S, { s: 1.2, vx: 38, range: 45, hit: 26 });
  }

  // うすぐらい うみ(200〜1000m)
  for (let i = some(8, 12); i > 0; i--) { const [x, y] = at(150, 1800); mk('jelly', x, y, { hue: pick([290, 190, 330, 160, 50, 220]), s: rand(1.1, 1.6), hit: 22 }); }
  for (let i = some(4, 7); i > 0; i--) { const [x, y] = at(200, 600, 0.2, 0.8); mk('squid', x, y, { s: 1.1, hit: 22 }); }
  for (let i = some(1, 2); i > 0; i--) mk('spider', ledgeX(L1, rand(0.4, 0.8)), L1.y - 4 * S - 26 * 1.3 * S, { s: 1.3, vx: 16, range: 40, hit: 40 });
  for (let i = some(1, 2); i > 0; i--) { const [x, y] = at(200, 650, 0.3, 0.7); mk('coela', x, y, { s: 1.3, hit: 30 }); }
  for (let i = some(2, 3); i > 0; i--) { const [x, y] = at(500, 900); mk('barrel', x, y, { s: 1.2, hit: 18 }); }
  for (let i = some(2, 3); i > 0; i--) { const [x, y] = at(600, 1000); mk('vampire', x, y, { s: 1.2, hit: 22 }); }
  for (let i = some(2, 3); i > 0; i--) mk('dumbo', ledgeX(L2, rand(0.3, 0.85)), L2.y - 6 * S - 10 * 1.2 * S, { s: 1.2, hit: 26 });

  // まっくらな うみ(1000〜3000m)
  for (let i = some(2, 3); i > 0; i--) { const [x, y] = at(1000, 1900); mk('angler', x, y, { s: 1.4, hit: 30 }); }
  for (let i = some(2, 3); i > 0; i--) { const [x, y] = at(1000, 2200); mk('fang', x, y, { s: 1.3, hit: 20 }); }
  for (let i = some(2, 3); i > 0; i--) mk('isopod', ledgeX(L3, rand(0.3, 0.85)), L3.y - 4 * S - 12 * 1.2 * S, { s: 1.2, vx: 12, range: 50, hit: 26 });
  for (let i = some(2, 3); i > 0; i--) { const [x, y] = at(1500, 3000); mk('pelican', x, y, { s: 1.3, hit: 15, len: 60, off: -30 }); }
  for (let i = some(2, 3); i > 0; i--) { const [x, y] = at(1500, 3500); mk('halo', x, y, { s: 1.2, hit: 12, len: 50 }); }

  // いちばん ふかい うみ(3000m〜)
  const floorX = () => { // 宝箱の 前は あけておく(画面が せまいときは あきらめる)
    let x = rand(0.06, 0.94) * W;
    for (let i = 0; i < 20 && Math.abs(x - W / 2) < 90 * S; i++) x = rand(0.06, 0.94) * W;
    return x;
  };
  for (let i = some(3, 5); i > 0; i--) mk('seapig', floorX(), F - 13 * 1.2 * S + 6 * S, { s: 1.2, vx: 10, range: 50, hit: 20 });
  for (let i = some(2, 3); i > 0; i--) mk('tripod', floorX(), F - 30 * 1.2 * S + 6 * S, { s: 1.2, hit: 22, hop: 0, hopT: 0 });
  chest = { x: W * 0.5, y: F + 34 * S, open: 0, target: 0 };

  // きらきらの 生きもの。毎回 ちがう子が えらばれ、少なくとも 3ひきは いる
  const pool = creatures.filter(c => TYPE[c.type]);
  pool.forEach(c => { if (Math.random() < 0.04) c.shiny = true; });
  for (let i = pool.filter(c => c.shiny).length; i < 3; i++) pick(pool).shiny = true;

  for (let i = 0; i < 160; i++) snow.push({ x: rand(0, W), y: rand(0, H), r: rand(0.8, 2), vy: rand(6, 16), ph: rand(0, TAU) });
  for (let i = 0; i < 40; i++) pebbles.push({ x: rand(0, W), y: F + rand(24, 0.13 * H), r: rand(2, 6), l: rand(-0.06, 0.06) });
}

function resize() {
  const oldW = W, oldWH = WH;
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight); DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  S = clamp(Math.min(W, H) / 760, 0.55, 1.35);
  R = Math.max(120, Math.min(W, H) * 0.26);
  WH = H * 20;
  if (!oldWH) return;
  if (oldW < 50 || oldWH < 1000) { // 見えない状態で 始まったときは 作りなおす
    build(); camY = 0; px = W * 0.5; py = H * 0.42; sub.x = px; sub.y = py; return;
  }
  const kx = W / oldW, ky = WH / oldWH;
  const all = [...creatures, ...visitors, ...rocks, ...weeds, ...snow, ...pebbles, ...bubbles, ...sparks, ...ledges, sub, chest];
  for (const o of all) {
    for (const a of ['x', 'hx', 'ox', 'ax']) if (o[a] !== undefined) o[a] *= kx;
    for (const b of ['y', 'hy', 'oy', 'ay']) if (o[b] !== undefined) o[b] *= ky;
  }
  camY = clamp(camY * ky, 0, WH - H);
  px = clamp(px * kx, 0, W); py = clamp(py, 0, H);
}

/* ---------- えを かく どうぐ ---------- */
function eye(g, x, y, r, lx, ly) {
  lx = lx || 0; ly = ly || 0;
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  const ex = x + lx * r * 0.3, ey = y + ly * r * 0.3;
  g.fillStyle = '#10213a'; g.beginPath(); g.arc(ex, ey, r * 0.58, 0, TAU); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(ex - r * 0.2, ey - r * 0.22, r * 0.2, 0, TAU); g.fill();
}
function ell(g, x, y, rx, ry, rot) { g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, TAU); g.fill(); }
function circle(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }

const DRAW = {
  fish(g, c, t) {

    g.beginPath(); g.moveTo(-4 * k, -8 * k); g.lineTo(2 * k, -14 * k); g.lineTo(6 * k, -8 * k); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.35)'; ell(g, -3 * k, 0, 3 * k, 9 * k);

    g.restore();
  },
  turtle(g, c, t) {
    const k = c.k, f = Math.sin(t * 2 + c.ph) * (1 + c.st); g.save(); g.translate(c.x, c.y); g.scale(c.dir, 1);
    const fl = (x, y, a, len) => { g.save(); g.translate(x, y); g.rotate(a); ell(g, len * 0.5, 0, len * 0.5, len * 0.2); g.restore(); };
    g.fillStyle = '#7cc68a';
    fl(12 * k, -12 * k, -0.9 + f * 0.4, 26 * k); fl(12 * k, 12 * k, 0.9 - f * 0.4, 26 * k);
    fl(-16 * k, -10 * k, -2.4 + f * 0.25, 14 * k); fl(-16 * k, 10 * k, 2.4 - f * 0.25, 14 * k);
    ell(g, 31 * k, -2 * k, 11 * k, 9 * k);
    g.fillStyle = '#3f8f5a'; ell(g, 0, 0, 28 * k, 20 * k);
    g.fillStyle = '#5fb574';
    for (const [x, y] of [[0, 0], [-13, -8], [13, -8], [-13, 8], [13, 8]]) ell(g, x * k, y * k, 6 * k, 5 * k);
    eye(g, 34 * k, -5 * k, 3.4 * k, 1, 0);

    g.restore();
  },
  star(g, c, t) {
    const k = c.k; g.save(); g.translate(c.x, c.y); g.rotate((c.rot || 0) + Math.sin(t * 3 + c.ph) * 0.12 * c.st);
    g.fillStyle = c.col; g.strokeStyle = c.col; g.lineJoin = 'round'; g.lineWidth = 5 * k;

    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = (i % 2 ? 7 : 17) * k;
      if (i) g.lineTo(Math.cos(a) * r, Math.sin(a) * r); else g.moveTo(Math.cos(a) * r, Math.sin(a) * r);

  },
  puffer(g, c, t) {
    const k = c.k, inf = c.st, r = (14 + 10 * inf) * k; g.save(); g.translate(c.x, c.y); g.scale(c.dir, 1);
    g.fillStyle = '#e0b84c';
    g.beginPath(); g.moveTo(-r * 0.8, 0); g.lineTo(-r - 10 * k, (-7 + Math.sin(t * 9) * 2) * k); g.lineTo(-r - 10 * k, (7 + Math.sin(t * 9) * 2) * k); g.closePath(); g.fill();

    g.strokeStyle = '#8a5a12'; g.lineWidth = 1.6 * k; g.beginPath(); g.arc(r * 0.92, r * 0.12, (1.5 + inf * 1.5) * k, 0, TAU); g.stroke();

    }

    g.fillStyle = `hsla(${c.hue},100%,92%,0.55)`; ell(g, -bw * 0.3, -bh * 0.55, bw * 0.28, bh * 0.2, -0.4);
    g.fillStyle = '#1a2a4a'; circle(g, -5 * k, -4 * k, 1.9 * k); circle(g, 5 * k, -4 * k, 1.9 * k);
    g.strokeStyle = '#1a2a4a'; g.lineWidth = 1.4 * k; g.beginPath(); g.arc(0, -2.5 * k, 2.4 * k, 0.4, Math.PI - 0.4); g.stroke();

  },
  squid(g, c, t) {

  c.x += c.vx * dt; c.y += c.vy * dt;
  if (Math.abs(c.vx) > 6) c.dir = c.vx > 0 ? 1 : -1;
}

}
function burst(x, y, n, col, speed) {

    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life, max: life, col: col || pick(SPARK), sz: rand(3, 7) * S });

}
function spawnBubbles(n, x, y, small) {

    vy: -rand(50, 110) * S, ph: rand(0, TAU), life: small ? 1.2 : 7, chase: !small });
  if (bubbles.length > 160) bubbles.splice(0, bubbles.length - 160);
}

const UPD = {

function drift(c, wx, ax, wy, ay) {
  c.x = c.hx + Math.sin(T * wx + c.ph) * ax * S; c.y = c.hy + Math.sin(T * wy + c.ph) * ay * S;
  c.dir = Math.cos(T * wx + c.ph) > 0 ? 1 : -1;

function distTo(c) {

// たまに 通りかかる 生きもの。m: 出てくる 深さ(m)、f/b: 頭の前・しっぽの後ろの 長さ、rare: 出てくる 確率

// きらきらの 子の まわりに 光の つぶ。暗やみの中でも 見えるので 目じるしになる

  } else if (!sessionFound[c.type]) {
    sessionFound[c.type] = true;
    if (!found[c.type]) { found[c.type] = true; saveFound(); }
    burst(c.x, c.y, 26); sfx.chime(); showToast(c.type); voice.say(`${name} を みつけたよ!`); c.cool = 5;
  } else if (c.cool <= 0 && blipCool <= 0) {
    burst(c.x, c.y, 6); sfx.blip(TYPE[c.type].note); c.cool = 5; blipCool = 0.3;
  }
}

function update(dt) {
  if (started && !paused()) {
    const kx = (held.ArrowRight ? 1 : 0) - (held.ArrowLeft ? 1 : 0), ky = (held.ArrowDown ? 1 : 0) - (held.ArrowUp ? 1 : 0);
    px = clamp(px + kx * 560 * dt, 0, W); py = clamp(py + ky * 560 * dt, 0, H);
    const top = H * 0.22, bot = H * 0.78, vmax = H * 0.75;
    const edge = py > bot ? (py - bot) / (H - bot) : py < top ? -(top - py) / top : 0;
    diveHold = edge ? diveHold + dt : 0;   // はしに おきつづけると だんだん はやく もぐる
    camY += edge * vmax * Math.min(3, 1 + diveHold * 0.6) * dt;
    camY = clamp(camY, 0, WH - H);
    if (camY > H * 0.3) hasDived = true;
  }
  const tx = clamp(px, 30 * S, W - 30 * S), ty = clamp(py + camY, H * 0.1, floorY() - 30 * S);
  const ox = sub.x, oy = sub.y, e = ease(0.02, dt);
  sub.x = lerp(sub.x, tx, e); sub.y = lerp(sub.y, ty, e);
  sub.vx = (sub.x - ox) / Math.max(dt, 1e-3); sub.vy = (sub.y - oy) / Math.max(dt, 1e-3);
  if (sub.vx > 20) sub.dir = 1; else if (sub.vx < -20) sub.dir = -1;
  sub.tilt = lerp(sub.tilt, clamp(sub.vy * 0.0012, -0.3, 0.3), ease(0.05, dt));
  if (Math.hypot(sub.vx, sub.vy) > 60 && Math.random() < dt * 8) spawnBubbles(1, sub.x - sub.dir * 48 * S, sub.y, true);
  sfx.depth(clamp(sub.y / floorY(), 0, 1));

  blipCool -= dt; popCool -= dt;
  for (const c of creatures) {
    c.k = c.s * S; c.cool -= dt;
    if (Math.abs(c.y - (camY + H / 2)) > H * 2.5) continue;   // 遠くの 生きものは 休ませておく
    const dx = sub.x - c.x, dy = sub.y - c.y, d = distTo(c);
    const lit = started && !!TYPE[c.type] && d < R * 0.78 + c.hit * c.k;
    if (lit && !c.lit) onLit(c);
    c.lit = lit;
    c.st += ((lit ? 1 : 0) - c.st) * ease(0.04, dt);
    c.lx = clamp(dx / 150, -1, 1); c.ly = clamp(dy / 150, -1, 1);
    UPD[c.type](c, dt, d);
    if (c.shiny) shimmer(c, dt);
  }

  // ときどき 通りかかる 生きもの(その深さに いるものから ランダムに えらぶ)
  visitTimer -= dt;
  if (started && visitTimer <= 0) { visitTimer = rand(7, 15); if (visitors.length < 3) spawnVisitor(); }
  for (const v of visitors) {
    v.k = v.s * S; v.cool -= dt;
    const lit = started && distTo(v) < R * 0.78 + v.hit * v.k;
    if (lit && !v.lit) onLit(v);
    v.lit = lit; v.st += ((lit ? 1 : 0) - v.st) * ease(0.04, dt);
    v.lx = clamp((sub.x - v.x) / 150, -1, 1); v.ly = clamp((sub.y - v.y) / 150, -1, 1);
    v.x += v.dir * v.sp * S * (1 - 0.6 * v.st) * dt;
    v.y = v.hy + Math.sin(T * 0.5 + v.ph) * 20 * S;
    if (VUPD[v.type]) VUPD[v.type](v, dt);
    if (v.shiny) shimmer(v, dt);
  }
  visitors = visitors.filter(v => Math.abs(v.y - (camY + H / 2)) < H * 3 &&
    (v.dir > 0 ? v.x - v.b * v.k < W + 40 : v.x + v.b * v.k > -40));

  for (const b of bubbles) { b.life -= dt; b.y += b.vy * dt; b.x += Math.sin(T * 3 + b.ph) * 20 * S * dt; if (b.y < 10) b.life = 0; }
  bubbles = bubbles.filter(b => b.life > 0);
  for (const s of sparks) { s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= Math.pow(0.3, dt); s.vy *= Math.pow(0.3, dt); s.vy -= 10 * S * dt; }
  sparks = sparks.filter(s => s.life > 0);
  for (const p of snow) {
    p.y += p.vy * S * dt; p.x += Math.sin(T * 0.5 + p.ph) * 4 * S * dt;
    if (p.y > camY + H + 30) { p.y = camY - rand(0, 30); p.x = rand(0, W); }
    else if (p.y < camY - 30) { p.y = camY + H + rand(0, 30); p.x = rand(0, W); }
  }

  chest.open += (chest.target - chest.open) * ease(0.02, dt);
  if (chest.target === 0 && Math.hypot(sub.x - chest.x, sub.y - chest.y) < R * 1.1 && Math.random() < dt * 4)
    burst(chest.x + rand(-30, 30) * S, chest.y - rand(0, 20) * S, 1, '#ffe27a', 40);
}

/* ---------- えを かく ---------- */
const onScreen = c => c.y > camY - 160 * S && c.y < camY + H + 160 * S;

function render() {
  const g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.save(); g.translate(0, -camY);
  const bg = g.createLinearGradient(0, 0, 0, WH);
  for (const [m, col] of [[0, '#2e8fc0'], [10, '#1b6b99'], [200, '#0e3c63'], [1000, '#071a33'], [MAXD, '#02060e']]) bg.addColorStop(clamp(yAt(m) / WH, 0, 1), col);
  g.fillStyle = bg; g.fillRect(0, camY, W, H);

  if (camY < H * 1.6) {
    // 水面から差しこむ光
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 6; i++) {
      const x = ((i + 0.5) / 6) * W + Math.sin(T * 0.2 + i * 1.7) * 40 * S, wTop = 30 * S, wBot = 120 * S, len = H * 1.6;
      const gr = g.createLinearGradient(0, 0, 0, len); gr.addColorStop(0, 'rgba(170,225,255,0.10)'); gr.addColorStop(1, 'rgba(170,225,255,0)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(x - wTop, 0); g.lineTo(x + wTop, 0); g.lineTo(x + wBot + len * 0.15, len); g.lineTo(x - wBot + len * 0.15, len); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = 'rgba(210,245,255,0.35)'; g.beginPath(); g.moveTo(0, 0);
    for (let x = 0; x <= W + 20; x += 20) g.lineTo(x, 8 * S + Math.sin(x * 0.02 + T * 1.5) * 4 * S);
    g.lineTo(W, 0); g.fill();
  }

  for (const c of creatures) if (c.type === 'octo' && onScreen(c)) drawC(g, c);
  for (const w of weeds) if (w.y > camY - 200 * S && w.y < camY + H + 200 * S) drawWeed(g, w, T);
  for (const r of rocks) if (Math.abs(r.y - (camY + H / 2)) < H / 2 + r.r0 * S * 1.2) drawRock(g, r);
  for (const l of ledges) if (l.y > camY - H * 0.6 && l.y < camY + H + 40 * S) drawLedge(g, l);
  drawFloor(g);
  if (onScreen(chest)) drawChest(g, chest, T);
  for (const c of creatures) if (c.type !== 'octo' && onScreen(c)) drawC(g, c);
  for (const v of visitors) if (!v.big) drawC(g, v);
  g.fillStyle = 'rgba(230,245,255,0.55)';
  for (const p of snow) if (p.y > camY && p.y < camY + H) circle(g, p.x, p.y, p.r * S);
  g.restore();

  // くらやみ(せんすいかんの まわりだけ明るい)
  const sx = sub.x, sy = sub.y - camY, f = clamp(Math.sqrt(mAt(sub.y) / 1200), 0, 1), dk = 0.45 + 0.5 * f * f * (3 - 2 * f);
  const grd = g.createRadialGradient(sx, sy, R * 0.12, sx, sy, R);
  grd.addColorStop(0, 'rgba(2,7,20,0)'); grd.addColorStop(0.55, `rgba(2,7,20,${dk * 0.25})`); grd.addColorStop(1, `rgba(2,7,20,${dk})`);
  g.fillStyle = grd; g.fillRect(0, 0, W, H);

  g.save(); g.translate(0, -camY);
  // 大きな 生きものは 暗やみの中でも うっすら 影が 見える
  for (const v of visitors) if (v.big) { g.globalAlpha = 0.22 + 0.7 * v.st; drawC(g, v); }
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'lighter';
  // 深いところでもライトの中が見えるように、水を照らす光を足す
  const lamp = g.createRadialGradient(sub.x, sub.y, 0, sub.x, sub.y, R * 0.95);
  const LC = LIGHT[look.light].rgb;
  lamp.addColorStop(0, `rgba(${LC},${0.05 + 0.14 * f})`); lamp.addColorStop(0.6, `rgba(${LC},${0.025 + 0.07 * f})`); lamp.addColorStop(1, `rgba(${LC},0)`);
  g.fillStyle = lamp; circle(g, sub.x, sub.y, R * 0.95);
  for (const c of creatures) if (GLOW[c.type] && onScreen(c)) GLOW[c.type](g, c, T);
  for (const v of visitors) if (GLOW[v.type]) GLOW[v.type](g, v, T);
  const lx = sub.x + sub.dir * 42 * S, ly = sub.y + 4 * S;
  const beam = g.createRadialGradient(lx, ly, 0, lx, ly, R * 1.1);
  beam.addColorStop(0, `rgba(${LC},0.18)`); beam.addColorStop(1, `rgba(${LC},0)`);
  g.fillStyle = beam; g.beginPath(); g.moveTo(lx, ly);
  g.arc(lx, ly, R * 1.1, sub.dir > 0 ? -0.38 : Math.PI - 0.38, sub.dir > 0 ? 0.38 : Math.PI + 0.38); g.closePath(); g.fill();
  for (const s of sparks) { g.globalAlpha = clamp(s.life / s.max, 0, 1); g.fillStyle = s.col; sparkle(g, s.x, s.y, s.sz); }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.lineWidth = 1.5 * S;
  for (const b of bubbles) {
    g.globalAlpha = clamp(b.life, 0, 1) * 0.8;
    g.strokeStyle = '#dff6ff'; g.beginPath(); g.arc(b.x, b.y, b.r, 0, TAU); g.stroke();
    g.fillStyle = '#ffffff'; circle(g, b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.25);
  }
  g.globalAlpha = 1;
  drawSub(g, T);
  g.restore();

  if (started) drawGauge(g);
  if (started && !hasDived && T - startT > 3) {
    // 「もっと ふかく もぐれるよ」の やじるし
    const a = 0.35 + 0.3 * Math.sin(T * 3), y = H - 70 + (reduceMotion ? 0 : Math.sin(T * 3) * 8);
    g.strokeStyle = `rgba(255,211,92,${a})`; g.lineWidth = 7; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(W / 2 - 26, y - 12); g.lineTo(W / 2, y + 12); g.lineTo(W / 2 + 26, y - 12); g.stroke();
    g.beginPath(); g.moveTo(W / 2 - 26, y - 34); g.lineTo(W / 2, y - 10); g.lineTo(W / 2 + 26, y - 34); g.stroke();
  }
}

function drawGauge(g) {
  const x = 22, y0 = H * 0.16, y1 = H * 0.78, fy = m => lerp(y0, y1, Math.sqrt(m / MAXD));
  g.save();
  g.strokeStyle = 'rgba(232,246,255,0.22)'; g.lineWidth = 4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke();
  g.fillStyle = 'rgba(232,246,255,0.55)'; g.font = `700 11px ${FONT}`; g.textBaseline = 'middle';
  for (const m of [0, 200, 1000, 2000, 3000, 4000]) { const y = fy(m); g.fillRect(x - 5, y - 1, 10, 2); g.fillText(m + 'm', x + 10, y); }
  const m = mAt(sub.y), y = fy(m);
  g.fillStyle = 'rgba(255,211,92,0.3)'; circle(g, x, y, 12);
  g.fillStyle = '#ffd35c'; circle(g, x, y, 7);
  g.font = `900 22px ${FONT}`; g.textBaseline = 'top'; g.fillText(Math.round(m / 10) * 10 + 'm', x - 10, y1 + 22);
  g.restore();
}

/* ---------- ずかん・みつけた! ---------- */
// [ちぢめる割合, よこのずれ, たてのずれ]
const ICON = { fish: [55, 4, 0], turtle: [95, -5, 0], star: [46, 0, 0], puffer: [80, 2, 0], octo: [70, 0, -2], jelly: [72, 0, -13],
  squid: [62, 0, 0], angler: [88, 3, 4], eel: [80, 0, 0], crab: [70, 0, 3], whale: [420, 0, 0],
  clown: [40, 2, 0], seahorse: [66, -4, -4], dolphin: [92, 0, 5], manta: [130, 10, 0], whaleshark: [175, 8, 8],
  spider: [170, 0, 6], coela: [90, 7, 2], barrel: [55, 4, 2], vampire: [60, 0, -1], dumbo: [56, 0, 3],
  oarfish: [285, 10, 26], giantsquid: [240, 43, 0], goblin: [160, 12, 2], frilled: [145, -5, 0], fang: [58, 2, 0],
  isopod: [85, -7, 1], pelican: [145, 29, -6], halo: [120, 0, -4], seapig: [50, 0, 2], tripod: [80, -1, -5], leviathan: [260, -10, 4] };
function drawIcon(cvs, type, ok, size, kira) {
  const d = Math.min(2, devicePixelRatio || 1);
  cvs.width = size * d; cvs.height = size * d;
  const g = cvs.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0);
  const [div, ox, oy] = ICON[type], k = size / div;
  g.beginPath(); g.arc(size / 2, size / 2, size / 2, 0, TAU); g.clip(); // 光が四角く切れないよう丸く切りぬく
  const c = { type, x: size / 2 + ox * k, y: type === 'eel' ? size * 0.84 : size / 2 + oy * k, k, s: 1, dir: 1, ph: 0,
    st: ['octo', 'vampire', 'barrel'].includes(type) ? 0 : 1, out: 1, lx: 0.3, ly: 0, rot: 0, vx: 0, pat: 'spot',
    hue: type === 'jelly' ? 290 : 12, jaw: 0.7, hop: 0, spin: 0,
    col: { fish: '#ff9f43', star: '#ff7b54', seahorse: '#ffb347' }[type] || '#f4f1e8' };
  if (ok && kira) g.filter = 'hue-rotate(70deg) saturate(1.7) brightness(1.15) drop-shadow(0 0 4px rgba(255,225,130,1))';
  DRAW[type](g, c, 1.2);
  if (ok && GLOW[type]) { g.globalCompositeOperation = 'lighter'; GLOW[type](g, c, 1.2); }
  g.filter = 'none';
  if (!ok) { g.globalCompositeOperation = 'source-in'; g.fillStyle = '#1d3a5c'; g.fillRect(0, 0, size, size); }
  g.globalCompositeOperation = 'source-over';
}

let toastTimer = 0;
function showToast(type, kira) {
  drawIcon(toastIcon, type, true, 64, kira);
  toastName.textContent = (kira ? 'きらきら! ' : 'みつけた! ') + TYPE[type].name;
  toast.classList.toggle('kira', !!kira);
  toast.hidden = false; toast.classList.remove('show'); void toast.offsetWidth; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; }, reduceMotion ? 3200 : 2800);
}

function openZukan() {

  let n = 0, kn = 0;
  ZONES.forEach((z, zi) => {
    const h = document.createElement('h3'); h.className = 'zone';
    const sm = document.createElement('small'); sm.textContent = z.range;
    h.append(z.name, sm); zukanGrid.appendChild(h);
    for (const t of TYPES.filter(t => t.z === zi)) {
      const ok = !!found[t.id], kira = ok && !!found[t.id + ':kira'];
      if (ok) n++; if (kira) kn++;
      const card = document.createElement('div'); card.className = 'card' + (ok ? '' : ' no') + (kira ? ' kira' : '');
      const cvs = document.createElement('canvas'); cvs.setAttribute('aria-hidden', 'true');
      const b = document.createElement('b'); b.textContent = ok ? t.name : '？？？';
      card.append(cvs, b);

      if (t.myth && ok) { const tag = document.createElement('i'); tag.textContent = 'そうぞうの いきもの'; card.appendChild(tag); }
      // 見つけた カードを おすと 名前を 読んでくれる

  zukanCount.textContent = `みつけた かず ${n} / ${TYPES.length}` + (kn ? `　★ ${kn}` : '');

}

const dressEl = $('dressBox'), dressBtn = $('dress'), dressPrev = $('dressPreview');
let dressOpen = false;
function paused() { return zukanOpen || dressOpen; }
function buildSwatches() {

  };
  fill($('bodySw'), BODY, 'body', it => it.c[0]);

}
function drawPreview() {

  if (dressPrev.width !== Math.round(w * d)) { dressPrev.width = Math.round(w * d); dressPrev.height = Math.round(h * d); }
  const g = dressPrev.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, w, h);
  const LC = LIGHT[look.light].rgb, k = Math.min(w / 160, h / 85), x = w * 0.36, y = h * 0.56 + Math.sin(T * 2) * 3, lx = x + 42 * k, ly = y + 4 * k;
  g.globalCompositeOperation = 'lighter';

  g.fillStyle = beam; g.beginPath(); g.moveTo(lx, ly); g.arc(lx, ly, w * 0.62, -0.38, 0.38); g.closePath(); g.fill();
  g.globalCompositeOperation = 'source-over';

}
function openDress() { buildSwatches(); dressEl.hidden = false; dressOpen = true; $('dressDone').focus(); }

/* ---------- そうさ ---------- */
function action(isPointer) {
  if (!started || paused()) return;
  sfx.resume();
  const nearChest = isPointer ? Math.hypot(px - chest.x, py + camY - chest.y) < 80 * S : Math.hypot(sub.x - chest.x, sub.y - chest.y) < R * 0.9;
  if (nearChest && chest.target === 0) { openChest(); return; }
  spawnBubbles(6, sub.x + sub.dir * 40 * S, sub.y - 6 * S, false); sfx.pop();
}

cv.addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; });
cv.addEventListener('pointerdown', e => {
  px = e.clientX; py = e.clientY;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  action(true);
});

  if (!started || paused()) return;
  e.preventDefault(); camY = clamp(camY + e.deltaY * 0.6, 0, WH - H); if (camY > H * 0.3) hasDived = true;
}, { passive: false });
addEventListener('contextmenu', e => e.preventDefault());

const ARROWS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (zukanOpen) closeZukan(); if (dressOpen) closeDress(); return; }
  if (!started) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } return; }
  e.preventDefault(); // 子どもが どのキーを押しても ページが動かないように
  if (paused()) { if (e.key === 'Enter') { if (zukanOpen) closeZukan(); if (dressOpen) closeDress(); } return; }
  if (ARROWS.includes(e.key)) { held[e.key] = true; return; }
  if (!e.repeat) action(false);
});
addEventListener('keyup', e => { held[e.key] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; });

function start() {

  started = true; startT = T;
  sfx.init(); sfx.resume();
  startEl.classList.add('gone'); setTimeout(() => { startEl.hidden = true; }, 650);
  volBtn.hidden = false; dressBtn.hidden = false; cv.classList.add('playing');
  try {
    const de = document.documentElement, p = de.requestFullscreen && de.requestFullscreen({ navigationUI: 'hide' });
    if (p && p.then) p.then(() => {
      // Chrome/Edge: キーを横取りして、Esc は長押ししないと全画面が解除されないようにする
      try { if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock().catch(() => {}); } catch (e) {}
    }).catch(() => {});
  } catch (e) {}
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
}
$('play').addEventListener('click', start);
volBtn.addEventListener('click', () => {
  const lv = sfx.cycle(); volBtn.dataset.level = lv;
  volBtn.setAttribute('aria-label', 'おと: ' + ['ふつう', 'ちいさめ', 'なし'][lv]);
  if (lv === 2) voice.stop();
});
$('zukanClose').addEventListener('click', closeZukan);
zukanEl.addEventListener('click', e => { if (e.target === zukanEl) closeZukan(); });
addEventListener('beforeunload', e => { if (started) { e.preventDefault(); e.returnValue = ''; } });
addEventListener('resize', resize);

resize(); build();
px = W * 0.5; py = H * 0.42; sub.x = px; sub.y = py;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  update(dt); render();
  if (dressOpen) drawPreview();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
