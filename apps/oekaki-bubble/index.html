<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おえかきバブル</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #06061a;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Hiragino Maru Gothic Pro', 'BIZ UDPGothic', sans-serif;
    user-select: none;
    cursor: crosshair;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #clear-btn {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.1);
    border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 40px;
    color: #fff;
    font-size: 22px;
    padding: 14px 40px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: background 0.2s;
    font-family: inherit;
  }
  #clear-btn:hover { background: rgba(255,255,255,0.18); }
  #clear-btn:active { transform: translateX(-50%) scale(0.96); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="clear-btn">ぜんぶ きえる</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const COLORS = [
  '#ff6eb4','#ff9fd4',
  '#c084fc','#a78bfa',
  '#60a5fa','#38bdf8',
  '#34d399','#86efac',
  '#facc15','#fb923c',
  '#f87171',
];

let bubbles = [];
let trails = [];
let sparks = [];
let drawing = false;
let lastX = 0, lastY = 0;
let colorIndex = 0;
let frame = 0;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function pickColor() {
  return COLORS[colorIndex % COLORS.length];
}

function spawnBubble(x, y) {
  const r = 18 + Math.random() * 32;
  bubbles.push({
    x, y,
    r,
    color: pickColor(),
    vx: (Math.random() - 0.5) * 0.6,
    vy: -0.5 - Math.random() * 0.8,
    life: 1,
    decay: 0.003 + Math.random() * 0.003,
  });
  colorIndex++;
}

function spawnSparks(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const angle = (Math.PI * 2 * i) / 14 + Math.random() * 0.4;
    const speed = 2 + Math.random() * 5;
    sparks.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      color,
      r: 3 + Math.random() * 4,
      life: 1,
    });
  }
}

function addTrail(x, y) {
  trails.push({
    x, y,
    r: 5 + Math.random() * 4,
    color: pickColor(),
    life: 1,
    decay: 0.012 + Math.random() * 0.008,
  });
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  if (e.touches) {
    return {
      x: e.touches[0].clientX - rect.left,
      y: e.touches[0].clientY - rect.top,
    };
  }
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function onStart(e) {
  e.preventDefault();
  drawing = true;
  const p = getPos(e);
  lastX = p.x; lastY = p.y;
  colorIndex++;
}

function onMove(e) {
  e.preventDefault();
  if (!drawing) return;
  const p = getPos(e);
  const dx = p.x - lastX, dy = p.y - lastY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > 8) {
    addTrail(p.x, p.y);
    if (Math.random() < 0.18) spawnBubble(p.x, p.y);
    lastX = p.x; lastY = p.y;
  }
}

function onEnd(e) { drawing = false; }

canvas.addEventListener('mousedown', onStart);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onEnd);
canvas.addEventListener('touchstart', onStart, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onEnd);

canvas.addEventListener('click', function(e) {
  const p = getPos(e);
  let hit = false;
  bubbles = bubbles.filter(b => {
    const dx = p.x - b.x, dy = p.y - b.y;
    if (Math.sqrt(dx * dx + dy * dy) < b.r + 8) {
      spawnSparks(b.x, b.y, b.color);
      hit = true;
      return false;
    }
    return true;
  });
});

document.getElementById('clear-btn').addEventListener('click', function(e) {
  e.stopPropagation();
  bubbles = [];
  trails = [];
  sparks = [];
});

function drawBubble(b) {
  const alpha = b.life;
  ctx.save();
  ctx.globalAlpha = alpha * 0.85;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.strokeStyle = b.color;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.globalAlpha = alpha * 0.12;
  ctx.fillStyle = b.color;
  ctx.fill();

  ctx.globalAlpha = alpha * 0.7;
  ctx.beginPath();
  ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.18, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.restore();
}

function loop() {
  frame++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  trails = trails.filter(t => {
    t.life -= t.decay;
    if (t.life <= 0) return false;
    ctx.save();
    ctx.globalAlpha = t.life * 0.7;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r * t.life, 0, Math.PI * 2);
    ctx.fillStyle = t.color;
    ctx.fill();
    ctx.restore();
    return true;
  });

  bubbles = bubbles.filter(b => {
    b.x += b.vx;
    b.y += b.vy;
    b.vx += (Math.random() - 0.5) * 0.1;
    b.life -= b.decay;
    if (b.life <= 0) return false;
    drawBubble(b);
    return true;
  });

  sparks = sparks.filter(s => {
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.12;
    s.vx *= 0.96;
    s.life -= 0.035;
    if (s.life <= 0) return false;
    ctx.save();
    ctx.globalAlpha = s.life;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * s.life, 0, Math.PI * 2);
    ctx.fillStyle = s.color;
    ctx.fill();
    ctx.restore();
    return true;
  });

  if (frame % 80 === 0 && Math.random() < 0.5) {
    const x = 60 + Math.random() * (canvas.width - 120);
    const y = 60 + Math.random() * (canvas.height - 160);
    spawnBubble(x, y);
  }

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
