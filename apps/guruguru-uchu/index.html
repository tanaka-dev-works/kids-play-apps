function shiftSpeed(d) { speedIdx = clamp(speedIdx + d, 0, SPEEDS.length - 1); drawFastIcon(); }
fastBtn.addEventListener('click', () => {   // 1 → 2 → 3 → 0.5 → 1
  speedIdx = speedIdx === 1 ? 2 : speedIdx === 2 ? 3 : speedIdx === 3 ? 0 : 1; drawFastIcon(); sfx.resume();
});

addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (zukanOpen) closeZukan(); if (dressOpen) closeDress(); return; }
  if (!started) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } return; }
  e.preventDefault(); // 子どもが どのキーを押しても ページが動かないように
  idleT = 0;
  if (ride && !zukanOpen && !dressOpen) { endRide(); return; }   // Esc いがいの どのキーでも のってみるを やめる
  if (zukanOpen || dressOpen) { if (e.key === 'Enter') { if (zukanOpen) closeZukan(); if (dressOpen) closeDress(); } return; }
  if (e.key === ' ') { if (!e.repeat) shower(); return; }   // スペースで ながれぼし
  if (e.key === 'ArrowUp') shiftSpeed(1); else if (e.key === 'ArrowDown') shiftSpeed(-1);
});
addEventListener('keyup', e => { if (started && e.key === ' ') e.preventDefault(); });   // ボタンに ピントが あっても スペースで おさせない

function start() {
  if (started) return;
  started = true;
  sfx.init(); sfx.resume();
  startEl.classList.add('gone'); setTimeout(() => { startEl.hidden = true; }, 650);
  volBtn.hidden = false; fastBtn.hidden = false; bookBtn.hidden = false; starBtn.hidden = false; dressBtn.hidden = false; zoomBtn.hidden = false; visitT = rand(10, 20);
  try {
    const de = document.documentElement, p = de.requestFullscreen && de.requestFullscreen({ navigationUI: 'hide' });
    if (p && p.then) p.then(() => {
      // Chrome/Edge: キーを横取りして、Esc は長押ししないと全画面が解除されないようにする
      try { if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock().catch(() => {}); } catch (e) {}
    }).catch(() => {});
  } catch (e) {}
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
}
$('play').addEventListener('click', start);
volBtn.addEventListener('click', () => {
  const lv = sfx.cycle(); volBtn.dataset.level = lv;
  volBtn.setAttribute('aria-label', 'おと: ' + ['ふつう', 'ちいさめ', 'なし'][lv]);
  if (lv === 2) voice.stop();
});
starBtn.addEventListener('click', () => { idleT = 0; sfx.resume(); shower(); });
bookBtn.addEventListener('click', () => { idleT = 0; sfx.resume(); openZukan(); });
/* ---------- とおくを みる ---------- */
function setZoom(i) {
  zoomIdx = i; zoomBtn.dataset.lv = i;
  $('zoomText').textContent = i === 2 ? 'もどる' : 'とおくを みる';
  zoomBtn.setAttribute('aria-label', i === 2 ? 'もとに もどる' : 'とおくを みる');
  sfx.zoom(i);
}
zoomBtn.addEventListener('click', () => { idleT = 0; sfx.resume(); ride = null; setZoom((zoomIdx + 1) % ZOOMS.length); });

/* ---------- ロケットの きせかえ(kurai-umi と おなじ つくり) ---------- */
function buildSwatches() {
  const fill = (box, list, key, bg) => {
    box.textContent = '';
    list.forEach((it, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'swatch';
      b.style.background = bg(it); b.setAttribute('aria-label', it.name); b.setAttribute('aria-pressed', String(look[key] === i));
      b.addEventListener('click', () => {
        look[key] = i; saveLook(); sfx.blip(PENTA[3 + (i % 5)]); buildSwatches();
        const again = box.children[i]; if (again) again.focus();
      });
      box.appendChild(b);
    });
  };
  fill($('bodySw'), ROCKET_BODY, 'body', it => `linear-gradient(135deg, ${it.c[0]}, ${it.c[1]})`);
  fill($('accSw'), ROCKET_ACC, 'acc', it => it.c);
}
function drawPreview() {
  const d = Math.min(2, devicePixelRatio || 1), w = dressPrev.clientWidth || 300, h = dressPrev.clientHeight || 170;
  if (dressPrev.width !== Math.round(w * d)) { dressPrev.width = Math.round(w * d); dressPrev.height = Math.round(h * d); }
  const g = dressPrev.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, w, h);
  g.fillStyle = '#fff';
  for (let i = 0; i < 26; i++) { g.globalAlpha = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(T * 2 + i * 1.7)); circle(g, ((i * 97) % 100) / 100 * w, ((i * 53) % 100) / 100 * h, 1 + (i % 3) * 0.5); }
  g.globalAlpha = 1;
  drawRocketShape(g, w / 2, h * 0.58 + Math.sin(T * 2) * 3, h * 0.2, 0.32, true);
}
function openDress() {
  if (!started || nova.ph || zukanOpen || dressOpen) return;
  if (grow) endPress();
  cancelPress(); ride = null;
  buildSwatches(); dressEl.hidden = false; dressOpen = true; $('dressDone').focus();
}
function closeDress() { dressEl.hidden = true; dressOpen = false; dressBtn.blur(); }
dressBtn.addEventListener('click', () => { idleT = 0; sfx.resume(); openDress(); });
$('dressClose').addEventListener('click', closeDress);
$('dressDone').addEventListener('click', () => { closeDress(); sfx.found(); });
dressEl.addEventListener('click', e => { if (e.target === dressEl) closeDress(); });
$('zukanClose').addEventListener('click', closeZukan);
zukanEl.addEventListener('click', e => { if (e.target === zukanEl) closeZukan(); });
addEventListener('beforeunload', e => { if (started) { e.preventDefault(); e.returnValue = ''; } });
addEventListener('resize', resize);

makeStars(); resize(); drawFastIcon();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (ready) {   // ずかん・きせかえを ひらいている あいだは うちゅうも ひとやすみ
    if (!zukanOpen && !dressOpen) update(dt); else if (dressOpen) T += dt;
    render();
    if (dressOpen) drawPreview();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
